<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tarjeta de producto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="flex: 1 1 auto; width: 100%; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; border: 1px solid #E4EAF1; border-radius: 16px; background: #FFFFFF; overflow: hidden; color: #1B2A3A; font-family: 'Lexend', system-ui, sans-serif; font-size: 15px; line-height: 1.45;">
  <a href="{{ p.url }}" onClick="{{ p.ver }}" tabindex="-1" aria-hidden="true" style="position: relative; height: 140px; display: flex; align-items: center; justify-content: center; background: {{ p.tint }}; text-decoration: none;">
    <sc-if value="{{ p.rx }}" hint-placeholder-val="{{ false }}">
      <span style="position: absolute; left: 10px; top: 10px; padding: 3px 10px; border-radius: 999px; background: #7B3F5E; color: #FFFFFF; font-size: 12px; font-weight: 600;">Con fórmula médica</span>
    </sc-if>
    <sc-if value="{{ p.conDesc }}" hint-placeholder-val="{{ false }}">
      <span style="position: absolute; left: 10px; top: 10px; padding: 3px 10px; border-radius: 999px; background: #8A4B14; color: #FFFFFF; font-size: 12px; font-weight: 600;">{{ p.descTxt }}</span>
    </sc-if>
    <sc-if value="{{ p.agotado }}" hint-placeholder-val="{{ false }}">
      <span style="position: absolute; right: 10px; top: 10px; padding: 3px 10px; border-radius: 999px; background: #52606F; color: #FFFFFF; font-size: 12px; font-weight: 600;">Agotado</span>
    </sc-if>
    <sc-if value="{{ p.esCaja }}" hint-placeholder-val="{{ true }}">
      <svg aria-hidden="true" width="86" height="94" viewBox="0 0 100 110" fill="none" stroke="#1B2A3A" stroke-width="2" stroke-linejoin="round"><path d="M20 32 L40 20 L84 20 L64 32 Z" fill="#FFFFFF"></path><path d="M64 32 L84 20 L84 90 L64 102 Z" fill="#EEF2F6"></path><rect x="20" y="32" width="44" height="70" fill="#FFFFFF"></rect><rect x="20" y="58" width="44" height="16" fill="{{ p.color }}"></rect><path d="M27 42 H50 M27 48 H44" stroke-linecap="round"></path></svg>
    </sc-if>
    <sc-if value="{{ p.esFrasco }}" hint-placeholder-val="{{ false }}">
      <svg aria-hidden="true" width="86" height="94" viewBox="0 0 100 110" fill="none" stroke="#1B2A3A" stroke-width="2" stroke-linejoin="round"><rect x="38" y="8" width="24" height="16" rx="3" fill="{{ p.color }}"></rect><path d="M41 24 H59 V32 H41 Z" fill="#FFFFFF"></path><rect x="26" y="32" width="48" height="70" rx="12" fill="#FFFFFF"></rect><path d="M26 52 H74 V80 H26 Z" fill="{{ p.color }}"></path></svg>
    </sc-if>
    <sc-if value="{{ p.esTubo }}" hint-placeholder-val="{{ false }}">
      <svg aria-hidden="true" width="86" height="94" viewBox="0 0 100 110" fill="none" stroke="#1B2A3A" stroke-width="2" stroke-linejoin="round"><rect x="30" y="8" width="40" height="8" rx="2" fill="{{ p.color }}"></rect><path d="M30 16 H70 L64 86 H36 Z" fill="#FFFFFF"></path><path d="M32.5 40 H67.5 L65.8 60 H34.2 Z" fill="{{ p.color }}"></path><rect x="42" y="86" width="16" height="16" rx="3" fill="#FFFFFF"></rect></svg>
    </sc-if>
    <sc-if value="{{ p.esPaquete }}" hint-placeholder-val="{{ false }}">
      <svg aria-hidden="true" width="86" height="94" viewBox="0 0 100 110" fill="none" stroke="#1B2A3A" stroke-width="2" stroke-linejoin="round"><path d="M22 24 L30 16 L38 24 L46 16 L54 24 L62 16 L70 24 L78 16 V96 A6 6 0 0 1 72 102 H28 A6 6 0 0 1 22 96 Z" fill="#FFFFFF"></path><rect x="22" y="44" width="56" height="22" fill="{{ p.color }}"></rect><path d="M32 80 H58 M32 87 H50" stroke-linecap="round"></path></svg>
    </sc-if>
  </a>
  <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px; padding: 12px 14px 14px;">
    <p style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #52606F;">
      <span aria-hidden="true" style="flex: none; width: 8px; height: 8px; border-radius: 50%; background: {{ p.color }};"></span>
      {{ p.catNombre }}
    </p>
    <h3 style="margin: 0; min-height: 2.6em; font-size: 15px; font-weight: 600; line-height: 1.3;">
      <a href="{{ p.url }}" onClick="{{ p.ver }}" style="color: #1B2A3A; text-decoration: none;">{{ p.n }}</a>
    </h3>
    <p style="margin: 0; font-size: 13px; line-height: 1.35; color: #52606F;">{{ p.pres }}</p>
    <div style="margin-top: auto; padding-top: 8px; display: flex; flex-direction: column; gap: 10px;">
      <sc-if value="{{ p.libre }}" hint-placeholder-val="{{ true }}">
        <p style="margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px;">
          <span style="font-size: 19px; font-weight: 700; line-height: 1.1;">{{ p.precioTxt }}</span>
          <sc-if value="{{ p.conDesc }}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 12.5px; color: #52606F;">Antes <s>{{ p.antesTxt }}</s></span>
          </sc-if>
        </p>
      </sc-if>
      <sc-if value="{{ p.rx }}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; font-size: 13px; color: #52606F;">Precio según disponibilidad</p>
      </sc-if>
      <sc-if value="{{ p.zero }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ p.add }}" aria-label="{{ p.addAria }}" style="width: 100%; min-height: 44px; border: 0; border-radius: 12px; background: #1E5AA0; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">Agregar</button>
      </sc-if>
      <sc-if value="{{ p.some }}" hint-placeholder-val="{{ false }}">
        <div role="group" aria-label="{{ p.grupoAria }}" style="display: flex; align-items: center; justify-content: space-between; border-radius: 12px; background: #EAF2FB; border: 2px solid #1E5AA0; color: #1E5AA0;">
          <button type="button" onClick="{{ p.dec }}" aria-label="{{ p.decAria }}" style="width: 44px; height: 40px; border: 0; background: transparent; color: #1E5AA0; font-family: inherit; font-size: 22px; font-weight: 600; cursor: pointer;">−</button>
          <span style="font-size: 16px; font-weight: 700; color: #1B2A3A;">{{ p.qty }}</span>
          <button type="button" onClick="{{ p.inc }}" aria-label="{{ p.incAria }}" style="width: 44px; height: 40px; border: 0; background: transparent; color: #1E5AA0; font-family: inherit; font-size: 22px; font-weight: 600; cursor: pointer;">+</button>
        </div>
      </sc-if>
      <sc-if value="{{ p.avisar }}" hint-placeholder-val="{{ false }}">
        <button type="button" aria-label="{{ p.avisarAria }}" style="width: 100%; min-height: 44px; border: 2px solid #52606F; border-radius: 12px; background: #FFFFFF; color: #1B2A3A; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">Preguntar disponibilidad</button>
      </sc-if>
      <sc-if value="{{ p.rx }}" hint-placeholder-val="{{ false }}">
        <button type="button" aria-label="{{ p.consultaAria }}" style="width: 100%; min-height: 44px; border: 2px solid #7B3F5E; border-radius: 12px; background: #FFFFFF; color: #7B3F5E; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">Consultar por WhatsApp</button>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"$preview":{"width":200,"height":380}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { qty: 0 };
  }
  renderVals() {
    if (this.props.item) return { p: this.props.item };
    var self = this;
    var q = this.state.qty;
    return {
      p: {
        url: '#producto-d1',
        ver: function (e) { if (e && e.preventDefault) e.preventDefault(); },
        n: 'Protector solar FPS 50',
        pres: 'Tubo × 60 g',
        catNombre: 'Piel y cuidado',
        color: '#E7B9A0',
        tint: '#FBE8DE',
        esCaja: false, esFrasco: false, esTubo: true, esPaquete: false,
        precioTxt: '$42.000',
        conDesc: true,
        antesTxt: '$49.400',
        descTxt: 'Ahorra 15 %',
        rx: false,
        libre: true,
        agotado: false,
        avisar: false,
        qty: q,
        zero: q === 0,
        some: q > 0,
        addAria: 'Agregar al pedido: Protector solar FPS 50',
        decAria: 'Quitar una unidad: Protector solar FPS 50',
        incAria: 'Agregar una unidad: Protector solar FPS 50',
        grupoAria: 'Cantidad de Protector solar FPS 50',
        consultaAria: '',
        avisarAria: '',
        add: function () { self.setState({ qty: 1 }); },
        inc: function () { self.setState({ qty: self.state.qty + 1 }); },
        dec: function () { self.setState({ qty: Math.max(0, self.state.qty - 1) }); }
      }
    };
  }
}
</script>
</body>
</html>
