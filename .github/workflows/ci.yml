# CI/CD: en cada PR y cada push a main corren las revisiones y las pruebas;
# solo en main, y si todo pasa, se construye con los datos de la hoja y se despliega a Cloudflare Workers.
# Variables y secrets: Settings → Secrets and variables → Actions (ver docs/OPERACION.md).
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  # Botón «Run workflow» y publicación desde la hoja (API de GitHub).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  calidad:
    name: Revisión y pruebas unitarias
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test

  navegador:
    name: Pruebas de navegador (Playwright + axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # La misma imagen del servicio «pruebas» de docker-compose.yml y la versión de @playwright/test.
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: playwright-report
          retention-days: 7

  desplegar:
    name: Desplegar a Cloudflare
    needs: [calidad, navegador]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Ambiente de GitHub con los secrets y variables del despliegue. Hoy es «qa»: despliegue de prueba, sin indexar.
    environment:
      name: qa
      url: ${{ vars.SITIO_URL || 'https://bigpharma-qa.emmanuel-bustamante.workers.dev' }}
    concurrency:
      group: despliegue-qa
      cancel-in-progress: false
    env:
      # La URL del worker bigpharma-qa, salvo que la variable SITIO_URL del ambiente diga otra.
      SITIO_URL: ${{ vars.SITIO_URL || 'https://bigpharma-qa.emmanuel-bustamante.workers.dev' }}
      SITIO_PUBLICO: ${{ vars.SITIO_PUBLICO }}
      VALIDAR_HOJA: ${{ vars.VALIDAR_HOJA }}
      SHEETS_PRODUCTOS_CSV_URL: ${{ vars.SHEETS_PRODUCTOS_CSV_URL }}
      SHEETS_ANUNCIOS_CSV_URL: ${{ vars.SHEETS_ANUNCIOS_CSV_URL }}
      SHEETS_CONFIGURACION_CSV_URL: ${{ vars.SHEETS_CONFIGURACION_CSV_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # El ambiente de wrangler.jsonc se elige en el build (worker bigpharma-qa); deploy va sin --env.
      - run: CLOUDFLARE_ENV=qa npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
